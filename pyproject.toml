[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "bamboo-hts"
version = "0.1.0"
description = "High-performance, modern Python library for HTS data (BAM, CRAM, VCF, etc.)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bamboo Contributors"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["bam", "vcf", "genomics", "hts", "bioinformatics", "arrow"]
dependencies = [
    "pyarrow>=16.0",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
pandas = ["pandas>=2.0", "pyarrow"]
dev = [
    "maturin",
    "pytest",
    "pytest-benchmark",
    "ruff",
    "mypy",
]
bench = [
    "pysam>=0.22",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/donncha/bamboo"
Repository = "https://github.com/donncha/bamboo"
Documentation = "https://github.com/donncha/bamboo/blob/main/MIGRATION.md"
Issues = "https://github.com/donncha/bamboo/issues"
Changelog = "https://github.com/donncha/bamboo/releases"

[tool.maturin]
manifest-path = "crates/bamboo-py/Cargo.toml"
python-source = "python"
module-name = "bamboo._bamboo"
features = ["pyo3/extension-module", "htslib"]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
    { path = "README.md", format = "sdist" },
    { path = "MIGRATION.md", format = "sdist" },
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
addopts = "-v --tb=short"
