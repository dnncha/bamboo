[package]
name = "bamboo-htslib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "htslib-backed CRAM, write, and pileup support for Bamboo (Phase 2)"
authors.workspace = true

[features]
default = []
htslib = ["dep:rust-htslib"]

[dependencies]
bamboo-core = { path = "../bamboo-core" }
thiserror = "2"
# curl disabled: hts-sys omits openssl-sys on Windows but still requires it when curl is on
rust-htslib = { version = "0.47", optional = true, default-features = false, features = ["bzip2", "lzma"] }

[dev-dependencies]
bamboo-noodles = { path = "../bamboo-noodles" }
tempfile = "3"