[workspace]
members = [
    "crates/bamboo-core",
    "crates/bamboo-io",
    "crates/bamboo-noodles",
    "crates/bamboo-htslib",
    "crates/bamboo-py",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/donncha/bamboo"
version = "0.1.0"
description = "High-performance HTS data library for Python"
authors = ["Bamboo Contributors"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3