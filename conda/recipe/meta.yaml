{% set name = "bamboo-hts" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Local development build from repo root:
  #   conda build conda/recipe --output-folder conda/dist
  path: ../..

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml || true
    - maturin build --release --strip --features htslib -o dist
    - pip install dist/bamboo_hts-*.whl --no-deps -vv
  run_exports:
    - {{ pin_subpackage('bamboo-hts', max_pin="x.x") }}
  missing_dso_whitelist:
    - "**/*.so"

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - maturin >=1.5,<2
    - cargo-bundle-licenses
    - pkg-config
  host:
    - python
    - pip
    - pyarrow >=16
    # hts-sys (via rust-htslib) links against these when compiling bundled htslib
    - zlib
    - bzip2
    - xz
    - libdeflate
    - libcurl
    - openssl  # [not osx]
  run:
    - python
    - pyarrow >=16

test:
  imports:
    - bamboo
  commands:
    - python -c "import bamboo as bm; assert bm.__version__; assert bm.pileup_available()"
    - python -c "from bamboo.compat import pysam; assert pysam.AlignmentFile is not None"

about:
  home: https://github.com/donncha/bamboo
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: High-performance Python library for HTS data (BAM, CRAM, VCF)
  description: |
    Bamboo provides fast, pysam-compatible BAM/CRAM/VCF reading with native
    Arrow columnar export for modern genomics workflows.
  dev_url: https://github.com/donncha/bamboo
  doc_url: https://github.com/donncha/bamboo/blob/main/MIGRATION.md

extra:
  recipe-maintainers:
    - donncha
  additional-platforms:
    - linux-aarch64
    - osx-arm64